name: sus-smart-care-full

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app-environment: &app-environment
  DB_USER: sus
  DB_PASSWORD: ${POSTGRES_PASSWORD:-sus}
  SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "4"
  SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "1"
  KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  KEYCLOAK_ISSUER: http://localhost:8180/realms/sus-smart-care
  KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/sus-smart-care/protocol/openid-connect/certs
  OTEL_TRACES_ENDPOINT: http://tempo:4318/v1/traces
  TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-0.10}

x-app-runtime: &app-runtime
  restart: unless-stopped
  mem_limit: ${APP_MEMORY_LIMIT:-512m}
  cpus: ${APP_CPU_LIMIT:-0.75}
  logging: *default-logging
  depends_on:
    postgres:
      condition: service_healthy
    kafka:
      condition: service_started
    keycloak:
      condition: service_healthy

services:

  # ========================================================
  # INFRAESTRUTURA
  # ========================================================

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-512m}
    cpus: ${POSTGRES_CPU_LIMIT:-1.0}
    logging: *default-logging
    command:
      - postgres
      - -c
      - max_connections=150
      - -c
      - shared_buffers=128MB
    environment:
      POSTGRES_USER: sus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sus}
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infrastructure/docker/init-databases.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U sus
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    mem_limit: ${REDIS_MEMORY_LIMIT:-128m}
    cpus: ${REDIS_CPU_LIMIT:-0.25}
    logging: *default-logging
    ports:
      - "6379:6379"
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 30

  kafka:
    image: apache/kafka:3.9.1
    restart: unless-stopped
    mem_limit: ${KAFKA_MEMORY_LIMIT:-768m}
    cpus: ${KAFKA_CPU_LIMIT:-1.0}
    logging: *default-logging
    ports:
      - "9092:9092"
    environment:
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx384m"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT_HOST://:9092,PLAINTEXT_INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  mosquitto:
    image: eclipse-mosquitto:2.0
    restart: unless-stopped
    mem_limit: ${MOSQUITTO_MEMORY_LIMIT:-64m}
    cpus: ${MOSQUITTO_CPU_LIMIT:-0.20}
    logging: *default-logging
    ports:
      - "1883:1883"
    volumes:
      - ./infrastructure/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./infrastructure/mosquitto/password_file:/mosquitto/config/password_file:ro

  # ========================================================
  # KEYCLOAK
  #
  # Nao usa mais H2.
  # Persiste no PostgreSQL do stack.
  # ========================================================

  keycloak:
    build:
      context: ./infrastructure/keycloak
      dockerfile: Dockerfile
    image: sus-smart-care-keycloak:26.3
    restart: unless-stopped
    mem_limit: ${KEYCLOAK_MEMORY_LIMIT:-1g}
    cpus: ${KEYCLOAK_CPU_LIMIT:-1.0}
    logging: *default-logging

    command:
      - start
      - --optimized
      - --import-realm
      - --http-enabled=true
      - --hostname-strict=false

    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}

      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: sus
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-sus}

      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"

      JAVA_OPTS_KC_HEAP: >-
        -XX:InitialRAMPercentage=20
        -XX:MaxRAMPercentage=50

    ports:
      - "8180:8080"

    volumes:
      - ./infrastructure/keycloak:/opt/keycloak/data/import:ro

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -c "{ printf 'HEAD /health/ready HTTP/1.0\r\n\r\n' >&0;
          grep 'HTTP/1.0 200'; } 0<>/dev/tcp/127.0.0.1/9000"
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 180s

  # ========================================================
  # COMPONENTE DE REFERENCIA DE EVENTSTORE
  # ========================================================

  eventstore:
    image: eventstore/eventstore:24.10.5-bookworm-slim
    restart: unless-stopped
    mem_limit: ${EVENTSTORE_MEMORY_LIMIT:-640m}
    cpus: ${EVENTSTORE_CPU_LIMIT:-0.50}
    logging: *default-logging
    environment:
      EVENTSTORE_INSECURE: "true"
      EVENTSTORE_ENABLE_ATOM_PUB_OVER_HTTP: "true"
    ports:
      - "2113:2113"
      - "1113:1113"

  # ========================================================
  # OBSERVABILIDADE
  # ========================================================

  tempo:
    image: grafana/tempo:2.8.2
    restart: unless-stopped
    mem_limit: ${TEMPO_MEMORY_LIMIT:-384m}
    cpus: ${TEMPO_CPU_LIMIT:-0.75}
    logging: *default-logging
    command:
      - -config.file=/etc/tempo.yml
    ports:
      - "3200:3200"
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./observability/tempo.yml:/etc/tempo.yml:ro

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    mem_limit: ${PROMETHEUS_MEMORY_LIMIT:-384m}
    cpus: ${PROMETHEUS_CPU_LIMIT:-0.50}
    logging: *default-logging
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus-full.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:12.1.0
    restart: unless-stopped
    mem_limit: ${GRAFANA_MEMORY_LIMIT:-384m}
    cpus: ${GRAFANA_CPU_LIMIT:-0.50}
    logging: *default-logging
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./observability/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro

  # ========================================================
  # MICROSSERVICOS
  # ========================================================

  patient-registry-service:
    <<: *app-runtime
    build:
      context: ./services/patient-registry-service
    ports:
      - "8081:8081"
    environment:
      <<: *app-environment
      DB_URL: jdbc:postgresql://postgres:5432/patient_registry

  patient-journey-service:
    <<: *app-runtime
    build:
      context: ./services/patient-journey-service
    ports:
      - "8082:8082"
    environment:
      <<: *app-environment
      DB_URL: jdbc:postgresql://postgres:5432/patient_journey
      PATIENT_REGISTRY_URL: http://patient-registry-service:8081

  triage-service:
    <<: *app-runtime
    build:
      context: ./services/triage-service
    ports:
      - "8083:8083"
    environment:
      <<: *app-environment
      DB_URL: jdbc:postgresql://postgres:5432/triage

  queue-service:
    <<: *app-runtime
    build:
      context: ./services/queue-service
    ports:
      - "8084:8084"
    environment:
      <<: *app-environment
      DB_URL: jdbc:postgresql://postgres:5432/queue_db
      PATIENT_JOURNEY_URL: http://patient-journey-service:8082

  telemetry-service:
    <<: *app-runtime
    mem_limit: ${TELEMETRY_MEMORY_LIMIT:-640m}
    cpus: ${TELEMETRY_CPU_LIMIT:-1.0}
    build:
      context: ./services/telemetry-service
    ports:
      - "8085:8085"
    environment:
      <<: *app-environment
      DB_URL: jdbc:postgresql://postgres:5432/telemetry
      MQTT_ENABLED: "true"
      MQTT_BROKER_URI: tcp://mosquitto:1883
      MQTT_USERNAME: device-demo
      MQTT_PASSWORD: device-demo-secret
      MQTT_CLIENT_ID: telemetry-service
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      TELEMETRY_ROLLING_SIZE: "120"
      TELEMETRY_ROLLING_TTL_MINUTES: "120"
      TELEMETRY_AGGREGATE_PUBLISH_EVERY: "10"

  presence-service:
    <<: *app-runtime
    build:
      context: ./services/presence-service
    ports:
      - "8086:8086"
    environment:
      <<: *app-environment
      DB_URL: jdbc:postgresql://postgres:5432/presence
      PATIENT_JOURNEY_URL: http://patient-journey-service:8082

  prehospital-service:
    <<: *app-runtime
    build:
      context: ./services/prehospital-service
    ports:
      - "8087:8087"
    environment:
      <<: *app-environment
      DB_URL: jdbc:postgresql://postgres:5432/prehospital

  notification-service:
    <<: *app-runtime
    build:
      context: ./services/notification-service
    ports:
      - "8088:8088"
    environment:
      <<: *app-environment
      DB_URL: jdbc:postgresql://postgres:5432/notification
      PATIENT_REGISTRY_URL: http://patient-registry-service:8081

  identity-access-service:
    <<: *app-runtime
    build:
      context: ./services/identity-access-service
    ports:
      - "8089:8089"
    environment:
      <<: *app-environment
      DB_URL: jdbc:postgresql://postgres:5432/identity_access

  clinical-query-service:
    <<: *app-runtime
    mem_limit: ${CLINICAL_QUERY_MEMORY_LIMIT:-640m}
    cpus: ${CLINICAL_QUERY_CPU_LIMIT:-0.75}
    build:
      context: ./platform/clinical-query-service
    ports:
      - "8090:8090"
    environment:
      <<: *app-environment
      DB_URL: jdbc:postgresql://postgres:5432/clinical_query
      REDIS_HOST: redis
      REDIS_PORT: "6379"

  facility-service:
    <<: *app-runtime
    build:
      context: ./services/facility-service
    ports:
      - "8091:8091"
    environment:
      <<: *app-environment
      DB_URL: jdbc:postgresql://postgres:5432/facility_db

  api-gateway:
    restart: unless-stopped
    mem_limit: ${APP_MEMORY_LIMIT:-512m}
    cpus: ${APP_CPU_LIMIT:-0.75}
    logging: *default-logging

    build:
      context: ./platform/api-gateway

    ports:
      - "8080:8080"

    environment:
      KEYCLOAK_ISSUER: http://localhost:8180/realms/sus-smart-care
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/sus-smart-care/protocol/openid-connect/certs
      OTEL_TRACES_ENDPOINT: http://tempo:4318/v1/traces
      TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-0.10}

      PATIENT_REGISTRY_URL: http://patient-registry-service:8081
      PATIENT_JOURNEY_URL: http://patient-journey-service:8082
      TRIAGE_URL: http://triage-service:8083
      QUEUE_URL: http://queue-service:8084
      TELEMETRY_URL: http://telemetry-service:8085
      PRESENCE_URL: http://presence-service:8086
      PREHOSPITAL_URL: http://prehospital-service:8087
      NOTIFICATION_URL: http://notification-service:8088
      IDENTITY_ACCESS_URL: http://identity-access-service:8089
      CLINICAL_QUERY_URL: http://clinical-query-service:8090
      FACILITY_URL: http://facility-service:8091

    depends_on:
      keycloak:
        condition: service_healthy
      patient-registry-service:
        condition: service_started
      patient-journey-service:
        condition: service_started
      triage-service:
        condition: service_started
      queue-service:
        condition: service_started
      telemetry-service:
        condition: service_started
      presence-service:
        condition: service_started
      prehospital-service:
        condition: service_started
      notification-service:
        condition: service_started
      identity-access-service:
        condition: service_started
      clinical-query-service:
        condition: service_started
      facility-service:
        condition: service_started

volumes:
  pgdata: {}