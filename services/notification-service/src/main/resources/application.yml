server:
  port: 8088
spring:
  application:
    name: notification-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/notification}
    username: ${DB_USER:sus}
    password: ${DB_PASSWORD:sus}
  jpa:
    hibernate.ddl-auto: validate
    properties.hibernate.jdbc.time_zone: UTC
    open-in-view: false
  flyway.enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties.spring.json.trusted.packages: '*'
      enable-auto-commit: false
    listener:
      ack-mode: record
  security.oauth2.resourceserver.jwt.issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8180/realms/sus-smart-care}
  security.oauth2.resourceserver.jwt.jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/sus-smart-care/protocol/openid-connect/certs}
management:
  endpoints.web.exposure.include: health,info,prometheus
  endpoint.health.show-details: always
springdoc.swagger-ui.path: /swagger-ui.html
management.tracing.sampling.probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
management.otlp.tracing.endpoint: ${OTEL_TRACES_ENDPOINT:http://localhost:4318/v1/traces}

patient-registry:
  base-url: ${PATIENT_REGISTRY_URL:http://localhost:8081}
