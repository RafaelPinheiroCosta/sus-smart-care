openapi: 3.0.3
info:
  title: Pre-Hospital API
  version: 0.4.0
  description: Ambulance/pre-arrival encounter, ETA and risk signal. Transport mode
    never hard-codes clinical priority.
servers:
- url: http://localhost:8080
  description: API Gateway
paths:
  /api/v1/pre-hospital/encounters:
    post:
      operationId: createPreHospitalEncounter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePreHospitalRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreHospitalEncounter'
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
  /api/v1/pre-hospital/encounters/{id}:
    get:
      operationId: getPreHospitalEncounter
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreHospitalEncounter'
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
  /api/v1/pre-hospital/encounters/{id}/eta:
    put:
      operationId: updateEta
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EtaRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreHospitalEncounter'
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
  /api/v1/pre-hospital/encounters/{id}/risk:
    put:
      operationId: updatePreHospitalRisk
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RiskRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreHospitalEncounter'
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ProblemDetail:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        timestamp:
          type: string
          format: date-time
        correlationId:
          type: string
    PreHospitalEncounter:
      type: object
      properties:
        id:
          type: string
          format: uuid
        patientId:
          type: string
          format: uuid
        visitId:
          type: string
          format: uuid
          nullable: true
        ambulanceId:
          type: string
        destinationFacilityId:
          type: string
          format: uuid
        estimatedArrivalAt:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
        riskLevel:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
    CreatePreHospitalRequest:
      type: object
      required:
      - patientId
      - ambulanceId
      - destinationFacilityId
      properties:
        patientId:
          type: string
          format: uuid
        visitId:
          type: string
          format: uuid
        ambulanceId:
          type: string
        destinationFacilityId:
          type: string
          format: uuid
        estimatedArrivalAt:
          type: string
          format: date-time
    EtaRequest:
      type: object
      required:
      - estimatedArrivalAt
      properties:
        estimatedArrivalAt:
          type: string
          format: date-time
    RiskRequest:
      type: object
      required:
      - riskLevel
      properties:
        riskLevel:
          type: string
security:
- bearerAuth: []
