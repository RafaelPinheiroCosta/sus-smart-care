openapi: 3.0.3

info:
  title: SUS Smart Care - Telemetry and Device API
  version: 0.6.0
  description: >
    Medical device inventory, temporal placement, patient-session assignment
    and biometric telemetry boundary.

servers:
  - url: http://localhost:8080
    description: API Gateway
  - url: http://localhost:8085
    description: Direct telemetry service

security:
  - bearerAuth: []

paths:

  /api/v1/devices:
    get:
      operationId: listDevices
      x-required-roles: [OPERATOR, TRIAGE_NURSE, DOCTOR, AMBULANCE_TEAM, ADMIN]
      responses:
        '200': { description: Devices }
        '401': { description: Unauthenticated }
        '403': { description: Forbidden }
    post:
      operationId: registerDevice
      x-required-roles: [ADMIN]
      responses:
        '201': { description: Device registered }
        '409': { description: Device already exists }

  /api/v1/devices/{id}:
    get:
      operationId: getDevice
      x-required-roles: [OPERATOR, TRIAGE_NURSE, DOCTOR, AMBULANCE_TEAM, ADMIN]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200': { description: Device }
        '404': { description: Not found }

  /api/v1/devices/{id}/status:
    patch:
      operationId: updateDeviceStatus
      x-required-roles: [ADMIN]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200': { description: Device status updated }
        '409': { description: Invalid device transition }

  /api/v1/devices/{id}/placements:
    post:
      operationId: placeDevice
      x-required-roles: [OPERATOR, ADMIN]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '201': { description: Placement created }
        '409': { description: Device already placed }

  /api/v1/devices/{id}/placement:
    get:
      operationId: getActiveDevicePlacement
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200': { description: Active placement }
        '404': { description: No active placement }

  /api/v1/device-placements/{id}/end:
    post:
      operationId: endDevicePlacement
      x-required-roles: [OPERATOR, ADMIN]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200': { description: Placement ended }
        '409': { description: Device is still assigned }

  /api/v1/telemetry/sessions:
    post:
      operationId: startTelemetrySession
      x-required-roles: [TRIAGE_NURSE, AMBULANCE_TEAM, ADMIN]
      responses:
        '201': { description: Session started }

  /api/v1/telemetry/sessions/{id}:
    get:
      operationId: getTelemetrySession
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200': { description: Session }
        '404': { description: Not found }

  /api/v1/telemetry/sessions/{id}/end:
    post:
      operationId: endTelemetrySession
      x-required-roles: [TRIAGE_NURSE, AMBULANCE_TEAM, ADMIN]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200': { description: Session ended }

  /api/v1/telemetry/sessions/{id}/assignments:
    post:
      operationId: assignDeviceToTelemetrySession
      x-required-roles: [TRIAGE_NURSE, AMBULANCE_TEAM, ADMIN]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '201': { description: Device assigned }
        '409': { description: Device unavailable }

  /api/v1/device-assignments/{id}/end:
    post:
      operationId: endDeviceAssignment
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200': { description: Assignment ended }

  /api/v1/telemetry/sessions/{id}/observations:
    post:
      operationId: ingestObservation
      x-required-roles: [DEVICE, AMBULANCE_TEAM, TRIAGE_NURSE, ADMIN]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '202': { description: Observation accepted }
        '409': { description: Device is not assigned to this session }

  /api/v1/telemetry/sessions/{sessionId}/summary:
    get:
      operationId: getTelemetrySummary
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: type
          in: query
          required: true
          schema: { type: string }
      responses:
        '200': { description: Statistical telemetry summary }

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    DeviceStatus:
      type: string
      enum: [ACTIVE, INACTIVE, REVOKED]

    DevicePlacementType:
      type: string
      enum: [FACILITY, CARE_ZONE, AMBULANCE]

    MedicalDevice:
      type: object

    DevicePlacement:
      type: object

    DeviceAssignment:
      type: object

    TelemetrySession:
      type: object

    BiometricObservation:
      type: object

# Stage 5 processing semantics:
# SPOT persists each biometric observation.
# CONTINUOUS keeps a rolling Redis window and persists aggregates.
# Normal continuous samples do not emit one Kafka event per sample.
# Anomalies are persisted and emitted immediately.

x-telemetry-processing:
  modes:
    SPOT:
      rawPersistence: true
      immediateObservationEvent: true
    CONTINUOUS:
      rawPersistence: false
      redisRollingWindow: true
      aggregatePersistence: true
      aggregateEventEverySamples: 10
      immediateAnomalyEvent: true

x-stage5-operations:
  getTelemetryAggregates:
    path: /api/v1/telemetry/sessions/{sessionId}/aggregates
  getTelemetryAnomalies:
    path: /api/v1/telemetry/sessions/{sessionId}/anomalies