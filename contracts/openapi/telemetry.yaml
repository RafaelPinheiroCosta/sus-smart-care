openapi: 3.0.3
info:
  title: Telemetry & Device Integration API
  version: 0.4.0
  description: Device/gateway ingestion boundary for hospital and pre-hospital biometric
    telemetry.
servers:
- url: http://localhost:8080
  description: API Gateway
paths:
  /api/v1/devices:
    post:
      operationId: registerDevice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedicalDevice'
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
  /api/v1/telemetry/sessions:
    post:
      operationId: startTelemetrySession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetrySession'
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
  /api/v1/telemetry/sessions/{id}/observations:
    post:
      operationId: ingestObservation
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ObservationRequest'
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BiometricObservation'
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
  /api/v1/telemetry/sessions/{sessionId}/summary:
    get:
      operationId: getTelemetrySummary
      parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: type
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetrySummary'
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ProblemDetail:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        timestamp:
          type: string
          format: date-time
        correlationId:
          type: string
    MedicalDevice:
      type: object
      properties:
        id:
          type: string
          format: uuid
        externalId:
          type: string
        deviceType:
          type: string
        manufacturer:
          type: string
        model:
          type: string
        status:
          type: string
        registeredAt:
          type: string
          format: date-time
    DeviceRequest:
      type: object
      required:
      - externalId
      - deviceType
      properties:
        externalId:
          type: string
        deviceType:
          type: string
        manufacturer:
          type: string
        model:
          type: string
    TelemetrySession:
      type: object
      properties:
        id:
          type: string
          format: uuid
        patientId:
          type: string
          format: uuid
        visitId:
          type: string
          format: uuid
          nullable: true
        preHospitalEncounterId:
          type: string
          format: uuid
          nullable: true
        sourceContext:
          type: string
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
          nullable: true
    SessionRequest:
      type: object
      required:
      - patientId
      - sourceContext
      properties:
        patientId:
          type: string
          format: uuid
        visitId:
          type: string
          format: uuid
        preHospitalEncounterId:
          type: string
          format: uuid
        sourceContext:
          type: string
          enum:
          - TRIAGE
          - PRE_HOSPITAL
          - IN_CARE
          - HOME_FUTURE
    ObservationRequest:
      type: object
      required:
      - deviceId
      - type
      - value
      properties:
        deviceId:
          type: string
          format: uuid
        type:
          type: string
        value:
          type: number
        unit:
          type: string
        measuredAt:
          type: string
          format: date-time
    BiometricObservation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        sessionId:
          type: string
          format: uuid
        deviceId:
          type: string
          format: uuid
        type:
          type: string
        value:
          type: number
        unit:
          type: string
        measuredAt:
          type: string
          format: date-time
        sourceContext:
          type: string
    TelemetrySummary:
      type: object
      description: Statistical, non-clinical summary. It must not be interpreted as
        diagnosis.
      properties:
        type:
          type: string
        count:
          type: integer
        minimum:
          type: number
        maximum:
          type: number
        average:
          type: number
        trend:
          type: string
          enum:
          - RISING
          - FALLING
          - STABLE
          - INSUFFICIENT_DATA
security:
- bearerAuth: []
