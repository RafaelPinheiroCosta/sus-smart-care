openapi: 3.0.3
info:
  title: Presence API
  version: 0.5.0
  description: Technology-neutral presence events from mobile, kiosk, reception, QR/NFC/beacon
    or staff confirmation.
servers:
- url: http://localhost:8080
  description: API Gateway
paths:
  /api/v1/presence/events:
    post:
      operationId: recordPresenceEvent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresenceRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresenceEvent'
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
  /api/v1/presence/visits/{visitId}:
    get:
      operationId: presenceHistory
      parameters:
      - name: visitId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: History
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PresenceEvent'
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
  /api/v1/presence/gateways:
    post:
      operationId: registerPresenceGateway
      responses:
        '201':
          description: Gateway registered
        '400':
          description: Invalid request
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
        '409':
          description: Conflict
    get:
      operationId: listPresenceGateways
      responses:
        '200':
          description: Registered gateways

  /api/v1/presence/tracking-sessions:
    post:
      operationId: startPresenceTracking
      description: >
        Starts a temporal presence tracking session and returns an opaque
        one-time tracking token. Only its SHA-256 hash is persisted.
      responses:
        '201':
          description: Tracking session created
        '400':
          description: Invalid request
        '403':
          description: Visit access denied
        '409':
          description: Visit already has active tracking

  /api/v1/presence/tracking-sessions/{id}:
    get:
      operationId: getPresenceTracking
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Current patient presence state
        '403':
          description: Visit access denied
        '404':
          description: Tracking session not found

  /api/v1/presence/tracking-sessions/{id}/end:
    post:
      operationId: endPresenceTracking
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Tracking session ended
        '403':
          description: Visit access denied
        '404':
          description: Tracking session not found
        '409':
          description: Tracking session already closed

  /api/v1/presence/signals:
    post:
      operationId: recordPresenceSignal
      description: >
        Technology-neutral signal endpoint supporting BLE, WIFI, UWB, QR,
        kiosk, manual and system sources. Raw signals use the opaque tracking
        token and do not contain patientId or visitId.
      responses:
        '202':
          description: Signal accepted or idempotently recognized
        '400':
          description: Invalid signal or gateway mismatch
        '404':
          description: Tracking session or gateway not found
        '409':
          description: Closed session or out-of-order signal

  /api/v1/presence/operations/zones:
    get:
      operationId: presenceZoneLoad
      description: >
        Operational zone occupancy view without exposing patient identity.
      responses:
        '200':
          description: Active occupancy and bottleneck status by zone
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ProblemDetail:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        timestamp:
          type: string
          format: date-time
        correlationId:
          type: string
    PresenceRequest:
      type: object
      required:
      - visitId
      - patientId
      - eventType
      - source
      properties:
        visitId:
          type: string
          format: uuid
        patientId:
          type: string
          format: uuid
        eventType:
          type: string
          enum:
          - ENTERED_FACILITY
          - LEFT_FACILITY
          - ENTERED_ZONE
          - LEFT_ZONE
          - PATIENT_RETURNED
        zoneId:
          type: string
        source:
          type: string
        occurredAt:
          type: string
          format: date-time
    PresenceEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        visitId:
          type: string
          format: uuid
        patientId:
          type: string
          format: uuid
        eventType:
          type: string
        zoneId:
          type: string
          nullable: true
        source:
          type: string
        occurredAt:
          type: string
          format: date-time
security:
- bearerAuth: []
