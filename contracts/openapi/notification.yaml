openapi: 3.0.3
info:
  title: Notification API
  version: 0.4.0
  description: Channel-adaptive notification routing for smartphone, representative,
    public display and staff-assisted calling.
servers:
- url: http://localhost:8080
  description: API Gateway
paths:
  /api/v1/notifications:
    post:
      operationId: sendNotification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendNotificationRequest'
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
  /api/v1/notifications/preferences:
    put:
      operationId: upsertPatientNotificationPreference
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreferenceRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreference'
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
  /api/v1/notifications/patients/{patientId}:
    get:
      operationId: notificationHistory
      parameters:
      - name: patientId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: History
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Notification'
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ProblemDetail:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        timestamp:
          type: string
          format: date-time
        correlationId:
          type: string
    Notification:
      type: object
      properties:
        id:
          type: string
          format: uuid
        patientId:
          type: string
          format: uuid
        visitId:
          type: string
          format: uuid
          nullable: true
        type:
          type: string
        channel:
          type: string
        message:
          type: string
        status:
          type: string
        createdAt:
          type: string
          format: date-time
        deliveredAt:
          type: string
          format: date-time
          nullable: true
    SendNotificationRequest:
      type: object
      required:
      - patientId
      - type
      - channel
      - message
      properties:
        patientId:
          type: string
          format: uuid
        visitId:
          type: string
          format: uuid
        type:
          type: string
        channel:
          type: string
        message:
          type: string
    PreferenceRequest:
      type: object
      required:
      - patientId
      - preferredChannel
      properties:
        patientId:
          type: string
          format: uuid
        hasSmartphone:
          type: boolean
        preferredChannel:
          type: string
        fallbackChannel:
          type: string
          nullable: true
    NotificationPreference:
      type: object
      properties:
        patientId:
          type: string
          format: uuid
        hasSmartphone:
          type: boolean
        preferredChannel:
          type: string
        fallbackChannel:
          type: string
          nullable: true
security:
- bearerAuth: []
