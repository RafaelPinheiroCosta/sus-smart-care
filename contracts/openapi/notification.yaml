openapi: 3.0.3
info:
  title: Notification API
  version: 0.4.1
  description: >
    Channel-adaptive notification delivery. Patient communication
    preferences are projected from Patient Registry events and are
    not directly writable through this API.
servers:
- url: http://localhost:8080
  description: API Gateway
paths:
  /api/v1/notifications:
    post:
      operationId: sendNotification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendNotificationRequest'
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
        '400':
          description: Invalid request
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden

  /api/v1/notifications/patients/{patientId}:
    get:
      operationId: notificationHistory
      parameters:
      - name: patientId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Notification history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Notification'
        '400':
          description: Invalid request
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Notification:
      type: object
      properties:
        id:
          type: string
          format: uuid
        patientId:
          type: string
          format: uuid
        visitId:
          type: string
          format: uuid
          nullable: true
        type:
          type: string
        channel:
          type: string
        message:
          type: string
        status:
          type: string
        createdAt:
          type: string
          format: date-time
        deliveredAt:
          type: string
          format: date-time
          nullable: true

    SendNotificationRequest:
      type: object
      required:
      - patientId
      - type
      - channel
      - message
      properties:
        patientId:
          type: string
          format: uuid
        visitId:
          type: string
          format: uuid
          nullable: true
        type:
          type: string
        channel:
          type: string
        message:
          type: string

security:
- bearerAuth: []
