openapi: 3.0.3
info:
  title: Identity Access API
  version: 0.4.1
  description: >
    Keycloak owns authentication and authorization identities.
    This service exposes application identity information derived
    from the authenticated JWT.
servers:
- url: http://localhost:8080
  description: API Gateway
paths:
  /api/v1/identity/me:
    get:
      operationId: getCurrentActor
      responses:
        '200':
          description: Current authenticated actor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActorIdentity'
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ActorIdentity:
      type: object
      required:
      - userId
      - roles
      properties:
        userId:
          type: string
          format: uuid
        roles:
          type: array
          items:
            type: string
security:
- bearerAuth: []
