services:

  # =========================================================
  # INFRAESTRUTURA ESSENCIAL
  # =========================================================

  postgres:
    mem_limit: 384m
    cpus: 1.0

  kafka:
    mem_limit: 768m
    cpus: 1.0

  keycloak:
    mem_limit: 1024m
    cpus: 1.0


  # =========================================================
  # FLUXO PACIENTE DIGITAL
  # =========================================================

  api-gateway:
    mem_limit: 384m
    cpus: 0.75
    environment:
      JAVA_TOOL_OPTIONS: >-
        -Xms64m
        -Xmx192m
        -XX:MaxMetaspaceSize=128m
        -XX:ActiveProcessorCount=2
      TRACING_SAMPLING_PROBABILITY: "0.0"

  patient-registry-service:
    mem_limit: 512m
    cpus: 1.0
    environment:
      JAVA_TOOL_OPTIONS: >-
        -Xms64m
        -Xmx256m
        -XX:MaxMetaspaceSize=160m
        -XX:ActiveProcessorCount=2
      TRACING_SAMPLING_PROBABILITY: "0.0"

  identity-access-service:
    mem_limit: 512m
    cpus: 1.0
    environment:
      JAVA_TOOL_OPTIONS: >-
        -Xms64m
        -Xmx256m
        -XX:MaxMetaspaceSize=160m
        -XX:ActiveProcessorCount=2
      TRACING_SAMPLING_PROBABILITY: "0.0"

  patient-journey-service:
    mem_limit: 512m
    cpus: 1.0
    environment:
      JAVA_TOOL_OPTIONS: >-
        -Xms64m
        -Xmx256m
        -XX:MaxMetaspaceSize=160m
        -XX:ActiveProcessorCount=2
      TRACING_SAMPLING_PROBABILITY: "0.0"
      PATIENT_REGISTRY_URL: http://patient-registry-service:8081

  triage-service:
    mem_limit: 512m
    cpus: 1.0
    environment:
      JAVA_TOOL_OPTIONS: >-
        -Xms64m
        -Xmx256m
        -XX:MaxMetaspaceSize=160m
        -XX:ActiveProcessorCount=2
      TRACING_SAMPLING_PROBABILITY: "0.0"

  queue-service:
    mem_limit: 512m
    cpus: 1.0
    environment:
      JAVA_TOOL_OPTIONS: >-
        -Xms64m
        -Xmx256m
        -XX:MaxMetaspaceSize=160m
        -XX:ActiveProcessorCount=2
      TRACING_SAMPLING_PROBABILITY: "0.0"


  # =========================================================
  # COMPONENTES FORA DO E2E PADRAO LOCAL
  #
  # Continuam existindo normalmente no docker-compose.full.yml.
  # Ao usar este override, ficam fora do startup padrao.
  # =========================================================

  clinical-query-service:
    profiles:
      - extended

  notification-service:
    profiles:
      - extended

  presence-service:
    profiles:
      - extended

  telemetry-service:
    profiles:
      - extended

  prehospital-service:
    profiles:
      - extended

  redis:
    profiles:
      - extended

  tempo:
    profiles:
      - observability

  prometheus:
    profiles:
      - observability

  grafana:
    profiles:
      - observability

  eventstore:
    profiles:
      - extended